name: CI

on:
  push:
    branches: [main, docs]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'specs/**'
  # No paths-ignore here: build/test-cli are required checks, and a skipped
  # required check never reports, so a docs-only PR could never merge.
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Lint
        run: npm run lint
      
      - name: Run Tests
        run: npm test -- --run

      # Written for node:test, so vitest.config.ts excludes it; it imports dist/, built above.
      - name: Conflict-tier classifier tests (node:test)
        run: node --test tests/conflict-tier.test.ts

  test-cli:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Test CLI help
        run: node dist/bin/spidersan.js --help
      
      - name: Test CLI version
        run: node dist/bin/spidersan.js --version
      
      - name: Test local init
        run: |
          node dist/bin/spidersan.js init
          ls -la .spidersan/

  # mcp-server/ is its own package (own lockfile), outside the root vitest include and the
  # root npm audit. Its tests spawn the built server and borrow the root's vitest.
  mcp-server:
    name: mcp-server build · test · audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-server/package-lock.json
      # --ignore-scripts: no dependency install hook runs; the builds those hooks
      # would have done (root `prepare`) run explicitly instead. Several tests
      # drive the root CLI's dist/.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm ci --ignore-scripts
        working-directory: mcp-server
      - run: npm run build
        working-directory: mcp-server
      - run: npm run test:run
        working-directory: mcp-server
      - run: npm audit --audit-level=high
        working-directory: mcp-server

  plugin-hooks:
    name: Plugin hook suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the plugin and marketplace JSON
        run: |
          for f in .claude-plugin/marketplace.json plugin/.claude-plugin/plugin.json plugin/hooks/spidersan-hooks.json; do
            jq empty "$f" || { echo "bad JSON: $f"; exit 1; }
          done
          # every hook the plugin wires must exist
          jq -r '.. | .command? // empty' plugin/hooks/spidersan-hooks.json \
            | sed -E 's#.*CLAUDE_PLUGIN_ROOT\}/([^"]+)".*#plugin/\1#' | sort -u \
            | while read -r f; do [ -f "$f" ] || { echo "wired but missing: $f"; exit 1; }; done
      # Each suite builds its own fixtures (stub CLIs on PATH, temp repos), so it
      # needs nothing installed beyond git, jq and python3.
      - name: Run the hook suites
        run: |
          set -uo pipefail
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          failed=()
          for t in plugin/tests/test-*.sh plugin/skills/*/bin/*.test.sh; do
            echo "::group::$t"
            if bash "$t"; then echo "PASS $t"; else echo "FAIL $t"; failed+=("$t"); fi
            echo "::endgroup::"
          done
          [ ${#failed[@]} -eq 0 ] || { printf 'FAILED: %s\n' "${failed[@]}"; exit 1; }

  ts-review-detect:
    name: ts-review detect step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/actions/ts-review/test-detect.sh

  security:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans a commit RANGE; the default shallow clone (depth 1)
          # makes it scan 0 bytes and die with exit 1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
