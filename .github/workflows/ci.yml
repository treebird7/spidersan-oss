name: CI

on:
  push:
    branches: [main, docs]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'specs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'specs/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Lint
        run: npm run lint
      
      - name: Run Tests
        run: npm test -- --run

  test-cli:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Test CLI help
        run: node dist/bin/spidersan.js --help
      
      - name: Test CLI version
        run: node dist/bin/spidersan.js --version
      
      - name: Test local init
        run: |
          node dist/bin/spidersan.js init
          ls -la .spidersan/

  security:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans a commit RANGE; the default shallow clone (depth 1)
          # makes it scan 0 bytes and die with exit 1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        # Prod deps only — what the published CLI ships. Dev-chain advisories
        # (eslint 8's minimatch→brace-expansion tree) can't be fixed without
        # the eslint 10 flat-config migration; blocking every merge on
        # lint-tooling DoS advisories is gate malfunction, not security.
        run: npm audit --omit=dev --audit-level=high

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
