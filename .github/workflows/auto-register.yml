# Spidersan Auto-Register (OIDC edition)
#
# Registers branch + changed files on every push — with ZERO repo secrets.
# CI mints a short-lived GitHub OIDC token; the register-branch edge function
# verifies it (issuer, audience, repository claim) and writes the registry
# server-side. Successor to the workflow retired in c9a449b for using an
# anon DB key from public-repo secrets.
#
# Setup: set repo variable SPIDERSAN_REGISTER_URL to the deployed function URL,
# e.g. https://<project-ref>.supabase.co/functions/v1/register-branch

name: Spidersan Auto-Register

on:
  push:
    branches-ignore:
      - main
      - staging/*

permissions:
  id-token: write
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register branch with Spidersan
        env:
          BEFORE: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
          REGISTER_URL: ${{ vars.SPIDERSAN_REGISTER_URL }}
        run: |
          set -euo pipefail

          # An unset variable means this repo registers nothing. Say so: the job
          # used to carry `if: vars.SPIDERSAN_REGISTER_URL != ''`, which skipped
          # with no annotation, so a repo holding this file but no variable looked
          # configured and registered nothing. Of the 13 org repos carrying this
          # workflow (2026-09-07), 12 set the variable; only Spidersan-deprecated
          # does not. Warn rather than fail so a deprecated repo does not go red
          # on every push; a repo that should register and does not now says so.
          if [ -z "${REGISTER_URL:-}" ]; then
            echo "::warning title=Branch NOT registered::SPIDERSAN_REGISTER_URL is not set on ${GITHUB_REPOSITORY}, so this branch was not registered. Spidersan cannot see it when checking cross-branch conflicts. Fix: gh variable set SPIDERSAN_REGISTER_URL --repo ${GITHUB_REPOSITORY} --body <register-branch function url>"
            {
              echo "### Branch NOT registered with Spidersan"
              echo ""
              echo "\`SPIDERSAN_REGISTER_URL\` is unset on \`${GITHUB_REPOSITORY}\`."
              echo "Cross-branch conflict detection will not see this branch."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Changed files; initial push has an all-zeros 'before' → diff against main
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff --name-only "origin/main...$COMMIT_SHA" 2>/dev/null || true)
          else
            FILES=$(git diff --name-only "$BEFORE" "$COMMIT_SHA" 2>/dev/null || true)
          fi

          TOKEN=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=spidersan-registry" | jq -r .value)

          jq -n --arg files "$FILES" \
            '{files: ($files | split("\n") | map(select(length > 0)))}' \
            | curl -sSf -X POST "$REGISTER_URL" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                --data-binary @-
