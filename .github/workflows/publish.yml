name: Publish to npm

on:
  # Auto-publish on release disabled — we publish manually with pnpm
  # release:
  #   types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0, 0.1.1-beta.1)'
        required: true
        type: string
      tag:
        description: 'npm tag (latest, beta, next)'
        required: false
        default: 'latest'
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for npm Trusted Publisher (OIDC)
    
    steps:
      - uses: actions/checkout@v4
      
      # Node 24 ships npm 11. Trusted publishing (OIDC) needs npm >= 11.5.1; on Node 20's
      # npm 10 the provenance was signed but the PUT went out unauthenticated and got E404.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build

      - name: Test
        run: |
          npm test -- --run
          node --test tests/conflict-tier.test.ts

      - name: Verify build
        run: |
          node dist/bin/spidersan.js --version
          node dist/bin/spidersan.js --help
      
      # Inputs go through env, never interpolated into the script, and are validated.
      # A failed `npm version` now stops the job instead of publishing package.json as-is.
      - name: Set version (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::bad version: $VERSION"; exit 1; }
          [[ "${TAG:-latest}" =~ ^[a-z][a-z0-9-]*$ ]] || { echo "::error::bad tag: $TAG"; exit 1; }
          current=$(node -p "require('./package.json').version")
          [ "$VERSION" = "$current" ] || npm version "$VERSION" --no-git-tag-version

      - name: npm version check
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a==11&&(b>5||(b==5&&c>=1)))?0:1)' "$(npm --version)" \
            || { echo "::error::trusted publishing needs npm >= 11.5.1"; exit 1; }

      - name: Publish to npm (Trusted Publisher)
        env:
          TAG: ${{ inputs.tag || 'latest' }}
        run: npm publish --provenance --access public --tag "$TAG"
      
      - name: Summary
        env:
          TAG: ${{ inputs.tag || 'latest' }}
        run: |
          v=$(node -p "require('./package.json').version")
          {
            echo "## 📦 Published to npm"
            echo ""
            echo "- **Package:** spidersan"
            echo "- **Version:** $v"
            echo "- **Tag:** ${TAG}"
            echo ""
            echo "Install with:"
            echo '```bash'
            echo "npm install -g spidersan"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
